[project]
name = "vid2webp"
version = "0.1.0"
description = "Convert a video file to an animated WebP (OpenCV + Pillow, no ffmpeg)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[project.scripts]
vid2webp = "vid2webp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vid2webp.py"]
